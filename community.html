<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/png" href="favicon.png" />

</head>
<body>

<!-- NAVİGASYON -->

  <div class="nav-container">

      <a href="index.html" style="text-decoration:none;display:flex;align-items:center;gap:10px;">
        <img src="logomuz.png" alt="NevGenç" class="brand-logo-img" />
        <div class="brand-texts">
          <span class="brand-text">NevGenç</span>
          <span class="brand-sub">SUBÜ & SAÜ</span>
        </div>
      </a>
    </div>
    <div class="nav-links">
      <a href="index.html#topluluklar" class="nav-link">← Tüm Topluluklar</a>
    </div>

      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="nav-mobile" id="navMobile">
    <a href="index.html#topluluklar" onclick="toggleMenu()">← Tüm Topluluklar</a>
  </div>
</nav>

<!-- İÇERİK (JS ile doldurulur) -->
<div id="pageContent">
  <div class="loading-full">
    <div class="spinner large-spin"></div>
    <p>Topluluk bilgileri yükleniyor…</p>
  </div>
</div>

<script src="data.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const communityId = params.get('id');

if (!communityId) {
  document.getElementById('pageContent').innerHTML = `
    <div class="not-found">
      <h2>Topluluk Bulunamadı</h2>
      <p>Geçerli bir topluluk ID'si belirtilmedi.</p>
      <a href="index.html" class="cta-primary">Ana Sayfaya Dön</a>
    </div>
  `;
} else {
  loadCommunityPage(communityId);
}

function loadCommunityPage(id) {
  const numericId = Number(id);
  const community = COMMUNITIES.find(c => c.id === numericId);
  const events = EVENTS
    .filter(e => e.community_id === numericId)
    .sort((a, b) => (a.event_date || '').localeCompare(b.event_date || ''));
  const posts = POSTS
    .filter(p => p.community_id === numericId)
    .sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));

  if (!community) {
    document.getElementById('pageContent').innerHTML = `
      <div class="not-found">
        <h2>Topluluk Bulunamadı</h2>
        <p>Bu topluluk mevcut değil veya silinmiş olabilir.</p>
        <a href="index.html" class="cta-primary">Ana Sayfaya Dön</a>
      </div>
    `;
    return;
  }

  document.title = `${community.name} — NevGenç`;

  const now = new Date();
  const upcomingEvents = (events || []).filter(e => new Date(e.event_date) >= now);
  const pastEvents = (events || []).filter(e => new Date(e.event_date) < now);
  const mediaPosts = (posts || []).filter(p => p.image_url || p.event_image);
  const textPosts = (posts || []).filter(p => p.content);

  // ─── HERO BANNERı ───
  const _safeName    = escHtml(community.name);
  const _safeInitial = escHtml(community.name.charAt(0));
  const logoEl = community.logo_path
    ? `<img src="${escHtml(community.logo_path)}" alt="${_safeName}" onerror="this.parentElement.innerHTML='<span class=\\'com-hero-initial\\'>${_safeInitial}</span>'" />`
    : `<span class="com-hero-initial">${_safeInitial}</span>`;

  // ─── BREADCRUMB ───
  document.getElementById('pageContent').innerHTML = `

    <!-- ── HERO BANNER ── -->
    <div class="com-hero-banner">
      <div class="com-hero-bg"></div>
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Ana Sayfa</a> <span>/</span> <a href="index.html#topluluklar">Topluluklar</a> <span>/</span> <span>${_safeName}</span></div>
        <div class="com-hero-inner">
          <div class="com-hero-logo">${logoEl}</div>
          <div class="com-hero-info">
            <div class="com-hero-cat">${escHtml(community.category || 'Genel')}</div>
            <h1 class="com-hero-name">${_safeName}</h1>
            <div class="com-hero-meta">
              <span>👑 ${escHtml(community.chairman_name || 'Belirtilmemiş')}</span>
              <span class="dot">·</span>
              <span>👥 ${community.member_count || 0} üye</span>
              <span class="dot">·</span>
              <span>⭐ ${(community.score||0).toFixed(0)} puan</span>
              ${community.contact_info ? `<span class="dot">·</span><span>📞 ${escHtml(community.contact_info)}</span>` : ''}
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── ANA İÇERİK ── -->
    <div class="container com-page-body">
      <div class="com-page-layout">

        <!-- SOL SÜTUN: Ana bilgiler -->
        <div class="com-main-col">

          <!-- HAKKINDA -->
          <div class="com-block">
            <h2 class="com-block-title">📖 Hakkımızda</h2>
            <p class="com-about-text">${escHtml(community.description || 'Bu topluluk henüz açıklama eklememiş.')}</p>
          </div>

          <!-- MED­YA GALERİSİ -->
          ${mediaPosts.length > 0 ? `
          <div class="com-block">
            <h2 class="com-block-title">🖼️ Fotoğraf Galerisi</h2>
            <div class="com-gallery">
              ${mediaPosts.map(p => {
                const img = p.event_image || p.image_url;
                const date = new Date(p.created_at).toLocaleDateString('tr-TR', {day:'numeric',month:'long',year:'numeric'});
                return `
                  <div class="gallery-item" onclick="openLightbox('${escapeStr(img)}','${escapeStr(p.content||'')}','${escapeStr(date)}')">
                    <img src="${escHtml(img)}" alt="Topluluk görseli" loading="lazy" />
                    <div class="gallery-overlay">
                      <span>🔍</span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
          ` : ''}

          <!-- SON PAYLAŞIMLAR -->
          ${textPosts.length > 0 ? `
          <div class="com-block">
            <h2 class="com-block-title">📣 Son Paylaşımlar</h2>
            <div class="posts-list">
              ${textPosts.slice(0,6).map(p => {
                const img = p.event_image || p.image_url;
                const date = new Date(p.created_at).toLocaleDateString('tr-TR', {day:'numeric',month:'long',year:'numeric'});
                return `
                  <div class="post-item">
                    ${img ? `<div class="post-img"><img src="${escHtml(img)}" alt="" /></div>` : ''}
                    <div class="post-body">
                      <p class="post-text">${escHtml(p.content)}</p>
                      <div class="post-foot">
                        <span>🗓️ ${date}</span>
                        ${p.support_count > 0 ? `<span>💜 ${p.support_count} destek</span>` : ''}
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
          ` : ''}

        </div>

        <!-- SAĞ SÜTUN: Yan bilgiler -->
        <div class="com-side-col">

          <!-- YÖNETİM EKİBİ -->
          <div class="side-card">
            <h3 class="side-card-title">👥 Yönetim Ekibi</h3>
            <div class="team-member-row">
              <div class="team-avatar crown">👑</div>
              <div>
                <div class="team-member-role">Başkan</div>
                <div class="team-member-name">${escHtml(community.chairman_name || 'Belirtilmemiş')}</div>
              </div>
            </div>
            ${community.vice_chairman_name ? `
            <div class="team-member-row" style="margin-top:.75rem;">
              <div class="team-avatar crown" style="font-size:1rem;">🥈</div>
              <div>
                <div class="team-member-role">Başkan Yardımcısı</div>
                <div class="team-member-name">${escHtml(community.vice_chairman_name)}</div>
              </div>
            </div>` : ''}
            ${community.secretary_name ? `
            <div class="team-member-row" style="margin-top:.75rem;">
              <div class="team-avatar crown" style="font-size:1rem;">📲</div>
              <div>
                <div class="team-member-role">Sosyal Medya Sorumlusu</div>
                <div class="team-member-name">${escHtml(community.secretary_name)}</div>
              </div>
            </div>` : ''}
            ${community.member3_name ? `
            <div class="team-member-row" style="margin-top:.75rem;">
              <div class="team-avatar crown" style="font-size:1rem;">📰</div>
              <div>
                <div class="team-member-role">Haber & Bilgilendirme Sorumlusu</div>
                <div class="team-member-name">${escHtml(community.member3_name)}</div>
              </div>
            </div>` : ''}
            ${community.member4_name ? `
            <div class="team-member-row" style="margin-top:.75rem;">
              <div class="team-avatar crown" style="font-size:1rem;">📞</div>
              <div>
                <div class="team-member-role">İletişim Sorumlusu</div>
                <div class="team-member-name">${escHtml(community.member4_name)}</div>
              </div>
            </div>` : ''}
          </div>

          <!-- İLETİŞİM & SOSYAL MEDYA -->
          ${(community.contact_info || community.social_instagram || community.social_twitter || community.social_linkedin) ? `
          <div class="side-card">
            <h3 class="side-card-title">📞 İletişim</h3>
            ${community.contact_info ? `
            <div class="contact-row">
              <span class="contact-icon">📱</span>
              <span>${escHtml(community.contact_info)}</span>
            </div>` : ''}
            ${community.social_instagram ? `
            <div class="contact-row" style="margin-top:.5rem;">
              <span class="contact-icon">📸</span>
              <a href="https://instagram.com/${encodeURIComponent(community.social_instagram.replace('@',''))}" target="_blank" rel="noopener"
                 style="color:inherit;text-decoration:none;">${escHtml(community.social_instagram)}</a>
            </div>` : ''}
            ${community.social_twitter ? `
            <div class="contact-row" style="margin-top:.5rem;">
              <span class="contact-icon">🐦</span>
              <a href="https://twitter.com/${encodeURIComponent(community.social_twitter.replace('@',''))}" target="_blank" rel="noopener"
                 style="color:inherit;text-decoration:none;">${escHtml(community.social_twitter)}</a>
            </div>` : ''}
            ${community.social_linkedin ? `
            <div class="contact-row" style="margin-top:.5rem;">
              <span class="contact-icon">💼</span>
              <a href="${escHtml(community.social_linkedin)}" target="_blank" rel="noopener"
                 style="color:inherit;text-decoration:none;">LinkedIn</a>
            </div>` : ''}
          </div>
          ` : ''}

          <!-- YAKLAŞAN ETKİNLİKLER -->
          <div class="side-card">
            <h3 class="side-card-title">📅 Yaklaşan Etkinlikler</h3>
            ${upcomingEvents.length === 0
              ? '<p class="side-empty">Yaklaşan etkinlik yok.</p>'
              : upcomingEvents.slice(0,4).map(e => {
                  const d = new Date(e.event_date);
                  const dateStr = d.toLocaleDateString('tr-TR', {day:'numeric',month:'long'});
                  const timeStr = d.toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit'});
                  return `
                    <div class="event-side-item">
                      ${e.image_url ? `<img src="${escHtml(e.image_url)}" class="event-side-img" alt="${escHtml(e.title)}" />` : ''}
                      <div class="event-side-body">
                        <div class="event-side-title">${escHtml(e.title)}</div>
                        <div class="event-side-meta">📅 ${dateStr} ${timeStr}</div>
                        ${e.location ? `<div class="event-side-meta">📍 ${escHtml(e.location)}</div>` : ''}
                        ${e.description ? `<div class="event-side-desc">${escHtml(e.description.length>80?e.description.slice(0,80)+'…':e.description)}</div>` : ''}
                      </div>
                    </div>
                  `;
                }).join('')
            }
          </div>

          <!-- TOPLULUK İSTATİSTİKLERİ -->
          <div class="side-card">
            <h3 class="side-card-title">📊 İstatistikler</h3>
            <div class="stats-list">
              <div class="stat-row"><span>👥 Üye Sayısı</span><strong>${community.member_count||0}</strong></div>
              <div class="stat-row"><span>⭐ Topluluk Puanı</span><strong>${(community.score||0).toFixed(1)}</strong></div>
              <div class="stat-row"><span>📅 Toplam Etkinlik</span><strong>${(events||[]).length}</strong></div>
              <div class="stat-row"><span>📣 Toplam Paylaşım</span><strong>${(posts||[]).length}</strong></div>
              <div class="stat-row"><span>🏷️ Kategori</span><strong>${escHtml(community.category||'Genel')}</strong></div>
            </div>
          </div>

        </div>
      </div>

      <!-- GEÇMİŞ ETKİNLİKLER (tam genişlik) -->
      ${pastEvents.length > 0 ? `
      <div class="com-block full-block">
        <h2 class="com-block-title">🗓️ Geçmiş Etkinlikler</h2>
        <div class="events-grid-full">
          ${pastEvents.map(e => {
            const d = new Date(e.event_date);
            const dateStr = d.toLocaleDateString('tr-TR', {day:'numeric',month:'long',year:'numeric'});
            return `
              <div class="event-full-card past-ev">
                ${e.image_url ? `<img src="${escHtml(e.image_url)}" class="event-full-img" alt="${escHtml(e.title)}" />` : '<div class="event-full-img-placeholder">📅</div>'}
                <div class="event-full-body">
                  <div class="event-full-title">${escHtml(e.title)}</div>
                  <div class="event-full-meta">📅 ${dateStr}</div>
                  ${e.location ? `<div class="event-full-meta">📍 ${escHtml(e.location)}</div>` : ''}
                  ${e.description ? `<div class="event-full-desc">${escHtml(e.description)}</div>` : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
      ` : ''}

    </div>

    <!-- LİGHTBOX -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
      <button class="lb-close" onclick="closeLightbox()">✕</button>
      <div class="lb-inner" onclick="event.stopPropagation()">
        <img id="lbImg" src="" alt="" />
        <div class="lb-caption" id="lbCaption"></div>
        <div class="lb-date" id="lbDate"></div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer-new">
      <div class="container">
        <div class="footer-top">
          <div class="footer-brand-col">
            <div class="footer-brand">
              <div class="brand-icon">N</div>
              <span class="brand-text">NevGenç</span>
            </div>
            <p>SUBÜ & SAÜ öğrencileri için kampüs toplulukları platformu.</p>
          </div>
          <div class="footer-links-col">
            <h4>Bağlantılar</h4>
            <a href="index.html#topluluklar">Tüm Topluluklar</a>
            <a href="index.html#universite">Üniversiteler</a>
          </div>
        </div>
        <div class="footer-bottom">
          <span>© 2025 NevGenç. Sakarya Uygulamalı Bilimler Üniversitesi & Sakarya Üniversitesi</span>
        </div>
      </div>
    </footer>
  `;
}

function escapeStr(s) { return s.replace(/'/g,"&#39;").replace(/"/g,"&quot;"); }

function escHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function openLightbox(src, caption, date) {
  document.getElementById('lbImg').src = src;
  document.getElementById('lbCaption').textContent = caption || '';
  document.getElementById('lbDate').textContent = date || '';
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

function toggleMenu() {
  document.getElementById('navMobile').classList.toggle('open');
}
</script>
