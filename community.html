<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Topluluk — NevGenç</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>(function(){var t=localStorage.getItem('ng-theme')||'geometric';if(t==='default'||t==='dark-red'||t==='starry')t='geometric';document.documentElement.setAttribute('data-theme',t);}());</script>
</head>
<body>

<!-- NAVİGASYON -->

  <div class="nav-container">

      <a href="index.html" style="text-decoration:none;display:flex;align-items:center;gap:10px;">
        <img src="logomuz.png" alt="NevGenç" class="brand-logo-img" />
        <div class="brand-texts">
          <span class="brand-text">NevGenç</span>
          <span class="brand-sub">SUBÜ & SAÜ</span>
        </div>
      </a>
    </div>
    <div class="nav-links">
      <a href="index.html#topluluklar" class="nav-link">← Tüm Topluluklar</a>
    </div>
    <button class="nav-hamburger" id="hamburger" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="nav-mobile" id="navMobile">
    <a href="index.html#topluluklar" onclick="toggleMenu()">← Tüm Topluluklar</a>
  </div>
</nav>

<!-- İÇERİK -->
<div id="pageContent">
  <div class="loading-full">
    <div class="spinner large-spin"></div>
    <p>Topluluk bilgileri yükleniyor…</p>
  </div>
</div>

<script src="data.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const communityId = params.get('id');
const communitySlug = params.get('slug');

if (!communityId && !communitySlug) {
  document.getElementById('pageContent').innerHTML = `
    <div class="not-found">
      <h2>Topluluk Bulunamadı</h2>
      <p>Geçerli bir topluluk ID'si veya kısaltması belirtilmedi.</p>
      <a href="index.html" class="cta-primary">Ana Sayfaya Dön</a>
    </div>
  `;
} else {
  loadCommunityPage(communityId, communitySlug);
}

function loadCommunityPage(id, slug) {
  let community;
  let numericId;
  if (slug) {
    community = COMMUNITIES.find(c => c.abbreviation === slug);
    numericId = community ? community.id : null;
  } else if (id) {
    numericId = Number(id);
    community = COMMUNITIES.find(c => c.id === numericId);
  }
  if (!community || !numericId) {
    document.getElementById('pageContent').innerHTML = `
      <div class="not-found">
        <h2>Topluluk Bulunamadı</h2>
        <p>Bu topluluk mevcut değil veya silinmiş olabilir.</p>
        <a href="index.html" class="cta-primary">Ana Sayfaya Dön</a>
      </div>
    `;
    return;
  }
  const events = EVENTS
    .filter(e => e.community_id === numericId)
    .sort((a, b) => (a.event_date || '').localeCompare(b.event_date || ''));
  const posts = POSTS
    .filter(p => p.community_id === numericId)
    .sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));

  document.title = community.name + " — NevGenç";

  const now = new Date();
  const upcomingEvents = (events || []).filter(e => new Date(e.event_date) >= now);
  const pastEvents = (events || []).filter(e => new Date(e.event_date) < now);
  const mediaPosts = (posts || []).filter(p => p.image_url || p.event_image);
  const textPosts = (posts || []).filter(p => p.content);

  // HERO / LOGO
  const _safeName    = escHtml(community.name);
  const _safeInitial = escHtml(community.name.charAt(0));
  const logoEl = community.logo_path
    ? '<img src="' + escHtml(community.logo_path) + '" alt="' + _safeName + '" onerror="this.parentElement.innerHTML=\'<span class=\'com-hero-initial\'>' + _safeInitial + '</span>\'" />'
    : '<span class="com-hero-initial">' + _safeInitial + '</span>';

  // ---- TEMPLATE ----
  document.getElementById('pageContent').innerHTML = `

    <!-- KART BAŞLIK -->
    <div class="com-card-page">
      <div class="com-card-header">
        <div class="com-card-logo">${logoEl}</div>
        <div class="com-card-main">
          <div class="com-card-cat">${escHtml(community.category || 'Genel')}</div>
          <h1 class="com-card-name">${_safeName}</h1>
          <div class="com-card-meta">
            <span>👑 ${escHtml(community.chairman_name || 'Belirtilmemiş')}</span>
            <span class="dot">·</span>
            <span>👥 ${community.member_count || 0} üye</span>
            <span class="dot">·</span>
            <span>⭐ ${(community.score||0).toFixed(0)} puan</span>
          </div>
        </div>
        ${community.abbreviation ? `<div class="com-card-abbr">${escHtml(community.abbreviation)}</div>` : ''}
      </div>

      <!-- İLETİŞİM HIZLI -->
      ${(community.contact_info || community.social_instagram || community.social_twitter || community.social_linkedin) ? `
      <div class="com-card-contact">
        ${community.contact_info ? `<a class="com-contact-link" href="tel:${community.contact_info.replace(/\s/g,'')}">📱 ${escHtml(community.contact_info)}</a>` : ''}
        ${community.social_instagram ? `<a class="com-contact-link" href="https://instagram.com/${encodeURIComponent(community.social_instagram.replace('@',''))}" target="_blank" rel="noopener">📸 ${escHtml(community.social_instagram)}</a>` : ''}
        ${community.social_twitter ? `<a class="com-contact-link" href="https://twitter.com/${encodeURIComponent(community.social_twitter.replace('@',''))}" target="_blank" rel="noopener">🐦 ${escHtml(community.social_twitter)}</a>` : ''}
        ${community.social_linkedin ? `<a class="com-contact-link" href="${escHtml(community.social_linkedin)}" target="_blank" rel="noopener">💼 LinkedIn</a>` : ''}
      </div>` : ''}

      <!-- ANA GRID: 2 sütun (desktop), 1 sütun (mobile) -->
      <div class="com-card-grid">

        <!-- SOL: Hakkında + Yönetim + İstatistikler -->
        <div class="com-card-col">

          <!-- HAKKINDA -->
          <div class="com-card-section">
            <h2 class="com-card-section-title">📖 Hakkımızda</h2>
            <p class="com-card-desc">${escHtml(community.description || 'Bu topluluk henüz açıklama eklememiş.')}</p>
          </div>

          <!-- YÖNETİM EKİBİ -->
          <div class="com-card-section">
            <h2 class="com-card-section-title">👥 Yönetim Ekibi</h2>
            <div class="com-team-list">
              <div class="com-team-member">
                <span class="com-team-avatar crown">👑</span>
                <div>
                  <div class="com-team-role">Başkan</div>
                  <div class="com-team-name">${escHtml(community.chairman_name || 'Belirtilmemiş')}</div>
                </div>
              </div>
              ${community.vice_chairman_name ? `
              <div class="com-team-member">
                <span class="com-team-avatar">🥈</span>
                <div>
                  <div class="com-team-role">Başkan Yardımcısı</div>
                  <div class="com-team-name">${escHtml(community.vice_chairman_name)}</div>
                </div>
              </div>` : ''}
              ${community.secretary_name ? `
              <div class="com-team-member">
                <span class="com-team-avatar">📲</span>
                <div>
                  <div class="com-team-role">Sosyal Medya</div>
                  <div class="com-team-name">${escHtml(community.secretary_name)}</div>
                </div>
              </div>` : ''}
              ${community.member3_name ? `
              <div class="com-team-member">
                <span class="com-team-avatar">📰</span>
                <div>
                  <div class="com-team-role">Haber & Bilgi</div>
                  <div class="com-team-name">${escHtml(community.member3_name)}</div>
                </div>
              </div>` : ''}
              ${community.member4_name ? `
              <div class="com-team-member">
                <span class="com-team-avatar">📞</span>
                <div>
                  <div class="com-team-role">İletişim</div>
                  <div class="com-team-name">${escHtml(community.member4_name)}</div>
                </div>
              </div>` : ''}
            </div>
          </div>

          <!-- İSTATİSTİKLER -->
          <div class="com-card-section com-card-stats">
            <h2 class="com-card-section-title">📊 İstatistikler</h2>
            <div class="com-stats-grid">
              <div class="com-stat"><span class="com-stat-label">Üye</span><strong class="com-stat-value">${community.member_count||0}</strong></div>
              <div class="com-stat"><span class="com-stat-label">Puan</span><strong class="com-stat-value">${(community.score||0).toFixed(1)}</strong></div>
              <div class="com-stat"><span class="com-stat-label">Etkinlik</span><strong class="com-stat-value">${(events||[]).length}</strong></div>
              <div class="com-stat"><span class="com-stat-label">Paylaşım</span><strong class="com-stat-value">${(posts||[]).length}</strong></div>
            </div>
          </div>

        </div>

        <!-- SAĞ: Yaklaşan Etkinlikler + Galeri + Son Paylaşımlar -->
        <div class="com-card-col">

          <!-- YAKLAŞAN ETKİNLİKLER -->
          <div class="com-card-section">
            <h2 class="com-card-section-title">📅 Yaklaşan Etkinlikler</h2>
            ${upcomingEvents.length === 0
              ? '<p class="com-card-empty">Yaklaşan etkinlik yok.</p>'
              : upcomingEvents.slice(0,3).map(e => {
                  const d = new Date(e.event_date);
                  const dateStr = d.toLocaleDateString('tr-TR', {day:'numeric',month:'short'});
                  const timeStr = d.toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit'});
                  return `
                    <div class="com-event-card">
                      ${e.image_url ? '<img src="' + escHtml(e.image_url) + '" class="com-event-img" alt="' + escHtml(e.title) + '" />' : ''}
                      <div class="com-event-body">
                        <div class="com-event-title">${escHtml(e.title)}</div>
                        <div class="com-event-meta">📅 ${dateStr} ${timeStr}</div>
                        ${e.location ? '<div class="com-event-meta">📍 ' + escHtml(e.location) + '</div>' : ''}
                      </div>
                    </div>
                  `;
                }).join('')
            }
          </div>

          <!-- FOTOĞRAF GALERİSİ (max 4) -->
          ${mediaPosts.length > 0 ? `
          <div class="com-card-section">
            <h2 class="com-card-section-title">🖼️ Fotoğraflar</h2>
            <div class="com-gallery-mini">
              ${mediaPosts.slice(0,4).map(p => {
                const img = p.event_image || p.image_url;
                const date = new Date(p.created_at).toLocaleDateString('tr-TR', {day:'numeric',month:'long',year:'numeric'});
                return `
                  <div class="com-gallery-item" onclick="openLightbox('${escapeStr(img)}','${escapeStr(p.content||'')}','${escapeStr(date)}')">
                    <img src="${escHtml(img)}" alt="Topluluk görseli" loading="lazy" />
                    <div class="gallery-overlay"><span>🔍</span></div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>` : ''}

          <!-- SON PAYLAŞIMLAR (max 3) -->
          ${textPosts.length > 0 ? `
          <div class="com-card-section">
            <h2 class="com-card-section-title">📣 Son Paylaşımlar</h2>
            <div class="com-posts-mini">
              ${textPosts.slice(0,3).map(p => {
                const img = p.event_image || p.image_url;
                const date = new Date(p.created_at).toLocaleDateString('tr-TR', {day:'numeric',month:'short'});
                return `
                  <div class="com-post-mini">
                    ${img ? '<img src="' + escHtml(img) + '" class="com-post-img" alt="" />' : ''}
                    <div class="com-post-body">
                      <p class="com-post-text">${escHtml(p.content)}</p>
                      <div class="com-post-foot">
                        <span>🗓️ ${date}</span>
                        ${p.support_count > 0 ? '<span>💜 ' + p.support_count + '</span>' : ''}
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>` : ''}

        </div>
      </div>

      <!-- GEÇMİŞ ETKİNLİKLER (altta, daraltılmış) -->
      ${pastEvents.length > 0 ? `
      <div class="com-card-section com-card-past">
        <h2 class="com-card-section-title">🗓️ Geçmiş Etkinlikler</h2>
        <div class="com-past-list">
          ${pastEvents.slice(0,4).map(e => {
            const d = new Date(e.event_date);
            const dateStr = d.toLocaleDateString('tr-TR', {day:'numeric',month:'short',year:'numeric'});
            return `
              <div class="com-past-item">
                ${e.image_url ? '<img src="' + escHtml(e.image_url) + '" class="com-past-img" alt="' + escHtml(e.title) + '" />' : '<div class="com-past-placeholder">📅</div>'}
                <div class="com-past-body">
                  <div class="com-past-title">${escHtml(e.title)}</div>
                  <div class="com-past-meta">📅 ${dateStr}${e.location ? ' · 📍 ' + escHtml(e.location) : ''}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>` : ''}

    </div>

    <!-- LİGHTBOX -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
      <button class="lb-close" onclick="closeLightbox()">✕</button>
      <div class="lb-inner" onclick="event.stopPropagation()">
        <img id="lbImg" src="" alt="" />
        <div class="lb-caption" id="lbCaption"></div>
        <div class="lb-date" id="lbDate"></div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer-new">
      <div class="container">
        <div class="footer-top">
          <div class="footer-brand-col">
            <div class="footer-brand">
              <div class="brand-icon">N</div>
              <span class="brand-text">NevGenç</span>
            </div>
            <p>SUBÜ & SAÜ öğrencileri için kampüs toplulukları platformu.</p>
          </div>
          <div class="footer-links-col">
            <h4>Bağlantılar</h4>
            <a href="index.html#topluluklar">Tüm Topluluklar</a>
            <a href="index.html#universite">Üniversiteler</a>
          </div>
        </div>
        <div class="footer-bottom">
          <span>© 2025 NevGenç. Sakarya Uygulamalı Bilimler Üniversitesi & Sakarya Üniversitesi</span>
        </div>
      </div    </footer>
  `;
}

function escapeStr(s) { return s.replace(/'/g, "\\'").replace(/"/g, '\\"'); }

function escHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&')
    .replace(/</g, '<')
    .replace(/>/g, '>')
    .replace(/"/g, '"')
    .replace(/'/g, "\\'");
}

function openLightbox(src, caption, date) {
  document.getElementById('lbImg').src = src;
  document.getElementById('lbCaption').textContent = caption || '';
  document.getElementById('lbDate').textContent = date || '';
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

function toggleMenu() {
  document.getElementById('navMobile').classList.toggle('open');
}
</script>
